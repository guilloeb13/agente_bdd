version: '3.8'

services:
  pma-agent:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: pma-agent
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
    networks:
      - pma-network
    depends_on:
      - postgres-test
    restart: unless-stopped

  postgres-test:
    image: postgres:15-alpine
    container_name: pma-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - pma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  pma-network:
    driver: bridge

volumes:
  postgres-data:
